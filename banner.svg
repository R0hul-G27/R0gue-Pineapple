<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="R0gue-Pineapple — security advisory banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120608"/>
      <stop offset="1" stop-color="#070405"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2B36" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2B36" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF2B36" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="260" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#fade)"/>

    <!-- grid -->
    <g stroke="#241014" stroke-width="1">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000"/>
      <path d="M60 0V260M140 0V260M220 0V260M300 0V260M380 0V260M460 0V260M540 0V260M620 0V260M700 0V260M780 0V260M860 0V260M940 0V260"/>
    </g>

    <!-- severity bar -->
    <rect x="0" y="0" width="6" height="260" fill="#E10600"/>

    <!-- header line -->
    <text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#6E4147">ADVISORY // R0G-0001 // TLP:CLEAR // STATUS: ACTIVE</text>

    <!-- handle -->
    <text x="38" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700" letter-spacing="-1" fill="#F2EDED">R0gue-Pineapple</text>
    <rect x="524" y="92" width="15" height="36" fill="#FF2B36">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- role -->
    <text x="40" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#FF2B36">penetration tester  ·  vulnerability management</text>

    <!-- vector -->
    <text x="40" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1" fill="#9B7A7E">CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:H/SI:H/SA:H</text>
    <text x="40" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1" fill="#E10600">10.0  CRITICAL</text>

    <!-- right-hand readout -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.4" fill="#5E2A31" text-anchor="end">
      <text x="960" y="76">CWE-79    reflected curiosity</text>
      <text x="960" y="100">CWE-284   improper access control</text>
      <text x="960" y="124">CWE-798   hardcoded stubbornness</text>
      <text x="960" y="198">web app VAPT  ·  OS-level VAPT</text>
      <text x="960" y="222">CVSS adjudication  ·  CSAF 2.0</text>
    </g>

    <!-- scan line -->
    <rect x="0" y="0" width="1000" height="2" fill="url(#scan)">
      <animate attributeName="y" values="-4;262;-4" dur="6s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="999" height="259" rx="10" fill="none" stroke="#3A1319"/>
  </g>
</svg>
